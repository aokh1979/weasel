schema:
  schema_id: penang_hokkien
  name: 庇能福建
  version: "1.0"
  description: Penang Hokkien IME
  dependencies: [penang_hokkien_exact]

switches:
  - name: ascii_mode
    reset: 0
    states: [中文, ABC]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - lua_translator@*exact_priority
  filters:
    - lua_filter@*tone_filter
    - uniquifier

tone_filter:
    tags: [ abc ]  

speller:
  alphabet: "abcdefghijklmnopqrstuvwxyzASDFGHJKLQWER"
  delimiter: " 'x"
  algebra:
    # Per-syllable rules generated by rebuild.command.
    __include: penang_fuzzy_algebra:/algebra

translator:
  dictionary: penang_hokkien
  prism: penang_hokkien
  enable_completion: true
  enable_sentence: true
  enable_user_dict: true
  user_dict: penang_hokkien_user
  initial_quality: 1
  spelling_hints: 9
  contextual_suggestions: true
  comment_format:
    - xform/[A-Z ]//
  # Show typed letters without syllable spaces, as before.
  preedit_format:
    - xform/ //

# Same lookup with Rime's neighbouring-key correction; used as a separate,
# lower-priority lane by exact_priority.lua.
corrector:
  dictionary: penang_hokkien
  prism: penang_hokkien
  enable_completion: false
  enable_sentence: false
  enable_user_dict: true
  user_dict: penang_hokkien_user
  initial_quality: 1
  spelling_hints: 9
  enable_correction: true
  comment_format:
    - xform/[A-Z ]//

punctuator:
  full_shape:
    " ": {commit: "　"}
    "!": {commit: "！"}
    ",": {commit: "，"}
    ".": {commit: "。"}
    "?": {commit: "？"}
    ":": {commit: "："}
    ";": {commit: "；"}
    "(": {commit: "（"}
    ")": {commit: "）"}
    "[": {commit: "「"}
    "]": {commit: "」"}
    "{": {commit: "『"}
    "}": {commit: "』"}
    "<": {commit: "《"}
    ">": {commit: "》"}
    "~": {commit: "～"}
    "\\": {commit: "、"}
  half_shape:
    "!": {commit: "！"}
    ",": {commit: "，"}
    ".": {commit: "。"}
    "?": {commit: "？"}
    ":": {commit: "："}
    ";": {commit: "；"}
    "(": {commit: "（"}
    ")": {commit: "）"}
    "[": {commit: "「"}
    "]": {commit: "」"}
    "{": {commit: "『"}
    "}": {commit: "』"}
    "<": {commit: "《"}
    ">": {commit: "》"}
    "~": {commit: "～"}
    "\\": {commit: "、"}

key_binder:
  bindings:
    - {accept: minus, send: Page_Up, when: has_menu}
    - {accept: equal, send: Page_Down, when: has_menu}

recognizer:
  patterns:
    email: "^[A-Za-z][-_.0-9A-Za-z]*@.*$"
    # uppercase: "[A-Z][-_+.'0-9A-Za-z]*$"
    url: "^(www[.]|https?:|ftp[.:]|mailto:|file:).*$|^[a-z]+[.].+$"
