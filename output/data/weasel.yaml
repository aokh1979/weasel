# Weasel settings
# encoding: utf-8

config_version: "0.23"

app_options:
  cmd.exe:
    ascii_mode: true
  conhost.exe:
    ascii_mode: true

show_notifications: true
# how long a period notifications shows
show_notifications_time: 1200
# use global ascii status
global_ascii: false

style:
  antialias_mode: default
  ascii_tip_follow_cursor: false
  color_scheme: warm_heart
  color_scheme_dark: char_koay_teow
  # Penang: Segoe UI for letters and tone marks, Microsoft JhengHei UI for
  # Chinese, PMingLiU-ExtB for rare characters, Segoe UI Emoji for emoji.
  font_face: "Segoe UI Emoji:2600:27BF, Segoe UI Emoji:1F000:1FAFF, Segoe UI:0:24FF, Microsoft JhengHei UI:2E80:FFFF, PMingLiU-ExtB:20000:3FFFF, Microsoft JhengHei UI"
  label_font_face: "Segoe UI"
  comment_font_face: "Segoe UI:0:24FF, Microsoft JhengHei UI"
  font_point: 14
  label_font_point: 14
  comment_font_point: 14
  candidate_abbreviate_length: 0
  click_to_capture: false
  horizontal: false
  fullscreen: false
  inline_preedit: false
  preedit_type: composition
  display_tray_icon: false
  label_format: "%s."
  mark_text: ""
  hover_type: none # semi_light, hilite
  paging_on_scroll: false
  vertical_auto_reverse: false
  vertical_text: false
  vertical_text_left_to_right: false
  vertical_text_with_wrap: false
  layout:
    align_type: center
    max_width: 0	#set 0 to disable max width
    min_width: 160
    min_height: 0
    max_height: 0	#set 0 to disable max height
    border_width: 3
    margin_x: 12
    margin_y: 12
    spacing: 10
    candidate_spacing: 18
    hilite_spacing: 6
    hilite_padding: 2
    round_corner: 4   #别名 hilited_corner_radius
    corner_radius: 4
    shadow_radius: 0
    shadow_offset_x: 4
    shadow_offset_y: 4
    linespacing: 0 # percentage of font point, 0 to disable
    baseline: 0 # percentage of font point, 0 to disable

